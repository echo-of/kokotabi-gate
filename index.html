function b2a(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function a2b(u){let s='';const x=new Uint8Array(u);for(let i=0;i<x.length;i+=32768)s+=String.fromCharCode.apply(null,x.subarray(i,i+32768));return btoa(s);}
async function keyFromPw(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  const ct=b2a(DATA.join(''));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,ct);
  if(!('DecompressionStream' in window)) throw new Error('unsupported');
  const stream=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text=await new Response(stream).text();
  document.open(); document.write(text); document.close();
}
async function tryStored(){
  if(true) return false;
  const s=localStorage.getItem('ktg_key');
  if(!s) return false;
  try{
    const key=await crypto.subtle.importKey('raw',b2a(s),{name:'AES-GCM'},true,['decrypt']);
    await openWith(key); return true;
  }catch(e){ localStorage.removeItem('ktg_key'); return false; }
}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  const pw=document.getElementById('pw').value;
  try{
    const key=await keyFromPw(pw);
    const rmEl=document.getElementById('rm');
    if(rmEl && rmEl.checked){
      const raw=await crypto.subtle.exportKey('raw',key);
      localStorage.setItem('ktg_key',a2b(raw));
    }
    await openWith(key);
  }catch(e){ err.textContent='パスワードが違います。'; }
});
tryStored();
